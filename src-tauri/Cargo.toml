[package]
name = "focusos"
version = "0.1.0"
description = "FocusOS - offline-first study workspace"
edition = "2021"

[lib]
name = "focusos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
focusos-core = { path = "../crates/focusos-core" }
