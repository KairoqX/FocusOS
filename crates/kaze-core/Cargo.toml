[package]
name = "kaze-core"
version = "0.1.0"
edition = "2021"
description = "Kaze Study business logic and SQLite persistence (no UI/Tauri dependency)"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
