[package]
name = "kaze-study"
version = "0.1.0"
description = "Kaze Study - offline-first study workspace"
edition = "2021"

[lib]
name = "kaze_study_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
kaze-core = { path = "../crates/kaze-core" }
